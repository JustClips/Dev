<!-- Game logo. Render: node art/logo/shot.js (Chromium via Playwright) -> art/out/ui/Logo.png -->
<html><head><link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.wrap{width:1024px;height:678px;position:relative;font-family:'Lilita One',sans-serif}
.t{position:absolute;left:0;right:0;text-align:center;line-height:1;letter-spacing:4px}
.l1{top:70px;font-size:250px}
.l2{top:335px;font-size:168px}
.fill{color:transparent;background:linear-gradient(#FFF6A8 0%,#FFD43B 45%,#FF9A3C 100%);-webkit-background-clip:text;background-clip:text;position:absolute;left:0;right:0}
.l2 .fill{background:linear-gradient(#E8FFD0 0%,#8BE04E 45%,#2FA84F 100%);-webkit-background-clip:text;background-clip:text}
.st{-webkit-text-stroke:34px #15151C;color:#15151C;position:absolute;left:0;right:0;text-shadow:0 14px 0 #15151C}
.globe{display:inline-block;width:138px;height:138px;vertical-align:-10px;background:url(../out/icons/Zones.png) center/contain no-repeat}
.ghost{display:inline-block;width:138px;height:138px;vertical-align:-10px}
img{position:absolute}
</style></head><body><div class="wrap">
<div class="t l1"><span class="st">SWEEP</span><span class="fill">SWEEP</span>&nbsp;</div>
<div class="t l2"><span class="st">THE W<span class="ghost"></span>RLD</span><span class="fill">THE W<span class="globe"></span>RLD</span>&nbsp;</div>
<img src="../out/icons/Tool_Broom.png" style="width:190px;left:820px;top:40px;transform:rotate(28deg)">
<img src="../out/icons/Dust.png" style="width:150px;left:800px;top:510px;transform:rotate(8deg)">
<img src="../out/icons/Egg.png" style="width:110px;left:60px;top:40px;transform:rotate(-18deg)">
</div></body></html>
